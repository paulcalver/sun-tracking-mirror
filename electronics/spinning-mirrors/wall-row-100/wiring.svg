<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 880" width="1060" height="880" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<style>
text{font-size:13px;fill:#1d232a}
.s{font-size:11px;fill:#55606b}
.b{font-weight:600}
.box{fill:#f3f5f7;stroke:#44505c;stroke-width:1.5}
.w{fill:none;stroke-width:2.5;stroke-linecap:round}
.red{stroke:#d63031}.blk{stroke:#111}.org{stroke:#e08a1e}.blu{stroke:#2a6fd6}.pur{stroke:#8a4fc7}.grn{stroke:#2a9d4a}
.dsh{stroke-dasharray:6 4}
</style>
<rect width="1060" height="880" fill="#ffffff"/>
<text x="30" y="32" class="b" style="font-size:16px">100 mm wall piece: two NEMA 17s in series on one driver</text>
<g class="s">
<line x1="660" y1="26" x2="690" y2="26" class="w red"/><text x="696" y="30">+24 V</text>
<line x1="750" y1="26" x2="780" y2="26" class="w blk"/><text x="786" y="30">GND</text>
<line x1="825" y1="26" x2="855" y2="26" class="w org"/><text x="861" y="30">3.3 V</text>
<line x1="910" y1="26" x2="940" y2="26" class="w blu"/><text x="946" y="30">signal</text>
</g>

<!-- wires first -->
<path d="M170 100 H610" class="w red"/>
<path d="M170 130 H560" class="w blk"/>
<path d="M610 100 V240" class="w red"/>
<path d="M560 130 V254" class="w blk"/>
<path d="M610 224 H640" class="w red"/>
<path d="M560 254 H640" class="w blk"/>
<path d="M610 240 H588" class="w red"/><path d="M582 240 H560" class="w blk"/>
<!-- motor coil A: 1A -> M1 A+ ; M1 A- joint M2 A+ ; M2 A- -> 1B -->
<path d="M820 228 H900" class="w pur"/>
<path d="M820 253 H835 V513 H900" class="w pur"/>
<path d="M900 253 H865 V488 H900" class="w pur dsh"/>
<!-- motor coil B: 2A -> M1 B+ ; M1 B- joint M2 B+ ; M2 B- -> 2B -->
<path d="M820 308 H900" class="w grn"/>
<path d="M820 333 H850 V593 H900" class="w grn"/>
<path d="M900 333 H880 V568 H900" class="w grn dsh"/>
<!-- ESP32 to driver -->
<path d="M260 284 H640" class="w blk"/>
<path d="M260 309 H640" class="w org"/>
<path d="M260 334 H640" class="w blu"/>
<path d="M260 359 H640" class="w blu"/>
<path d="M260 384 H640" class="w blu"/>
<path d="M380 384 V450" class="w blu"/>
<path d="M320 309 V450 H336 M366 450 H380" class="w org"/>
<circle cx="320" cy="309" r="3.4" fill="#e08a1e"/><circle cx="380" cy="384" r="3.4" fill="#2a6fd6"/>
<circle cx="320" cy="450" r="3.4" fill="#e08a1e"/><circle cx="380" cy="450" r="3.4" fill="#2a6fd6"/>
<path d="M150 520 V550" class="w blk" stroke-dasharray="5 4"/>

<path d="M360 100 V165" class="w red"/><path d="M390 130 V165" class="w blk"/>
<path d="M330 190 H308 M292 190 H282 V214 H260" class="w red" stroke-dasharray="6 3"/>
<circle cx="360" cy="100" r="3.4" fill="#d63031"/><circle cx="390" cy="130" r="3.4" fill="#111"/>
<!-- power chain -->
<text x="30" y="62" class="s">mains in</text>
<rect x="30" y="70" width="140" height="90" rx="6" class="box"/>
<text x="42" y="95" class="b">24 V supply</text><text x="42" y="113" class="s">own protection, no fuse</text>
<text x="156" y="104" text-anchor="end" class="s">+</text><text x="156" y="134" text-anchor="end" class="s">-</text>
<rect x="200" y="70" width="150" height="90" rx="6" class="box"/>
<text x="210" y="95" class="b">Panel DC socket</text><text x="210" y="113" class="s">back wall, 11 mm hole</text><text x="210" y="127" class="s">5.5 x 2.1 mm plug</text>
<rect x="330" y="165" width="170" height="60" rx="6" class="box"/>
<text x="340" y="185" class="b">24 V to 5 V buck</text><text x="340" y="201" class="s">45 x 32 mm, set to 5.0 V first</text><text x="340" y="215" class="s">in: +24 V / GND (Wago)</text>
<text x="350" y="160" text-anchor="end" class="s">+IN</text><text x="400" y="160" class="s">-IN</text>
<polygon points="292,183 292,197 306,190" fill="#fff" stroke="#44505c" stroke-width="1.6"/><line x1="308" y1="182" x2="308" y2="198" stroke="#44505c" stroke-width="2"/>
<text x="300" y="177" text-anchor="middle" class="s">Schottky</text><text x="276" y="204" text-anchor="end" class="s">5 V</text>
<rect x="440" y="88" width="80" height="24" rx="4" class="box"/><text x="480" y="104" text-anchor="middle" class="s">Wago +24 V</text>
<rect x="440" y="118" width="80" height="24" rx="4" class="box"/><text x="480" y="134" text-anchor="middle" class="s">Wago GND</text>
<circle cx="610" cy="100" r="3.4" fill="#d63031"/><circle cx="560" cy="130" r="3.4" fill="#111"/>

<line x1="588" y1="230" x2="588" y2="250" stroke="#111" stroke-width="2.5"/><line x1="582" y1="230" x2="582" y2="250" stroke="#111" stroke-width="2.5"/><text x="553" y="244" text-anchor="end" class="s">100 uF 35 V+</text><circle cx="610" cy="240" r="3.4" fill="#d63031"/><circle cx="560" cy="240" r="3.4" fill="#111"/>

<!-- the one driver -->
<rect x="640" y="200" width="180" height="236" rx="6" class="box"/>
<text x="650" y="228" class="s">+ (motor supply)</text>
<text x="650" y="258" class="s">GND</text>
<text x="650" y="288" class="s">GND (logic)</text>
<text x="650" y="313" class="s">VDD (3.3 V logic)</text>
<text x="650" y="338" class="s">STEP</text>
<text x="650" y="363" class="s">DIR</text>
<text x="650" y="388" class="s">EN (low = on)</text>
<text x="650" y="404" class="s">MS1, MS2 open = 1/8 step</text>
<text x="650" y="422" class="b">Adafruit TMC2209, one</text>
<text x="812" y="228" text-anchor="end" class="s">1A</text>
<text x="812" y="253" text-anchor="end" class="s">1B</text>
<text x="812" y="308" text-anchor="end" class="s">2A</text>
<text x="812" y="333" text-anchor="end" class="s">2B</text>

<!-- motor 1 -->
<rect x="900" y="205" width="140" height="140" rx="6" class="box"/>
<text x="910" y="228" class="s">blue  (A+)</text>
<text x="910" y="253" class="s">red  (A-)</text>
<text x="910" y="308" class="s">green  (B+)</text>
<text x="910" y="333" class="s">black  (B-)</text>
<text x="970" y="270" text-anchor="middle" class="b">NEMA 17 #1</text>
<text x="970" y="284" text-anchor="middle" class="s">left end of rail,</text><text x="970" y="297" text-anchor="middle" class="s">mirrors 1-3</text>
<text x="900" y="362" class="s">0.5 m 4-pin lead,</text><text x="900" y="375" class="s">out the LEFT end wall</text>

<!-- series joints -->
<rect x="858" y="395" width="14" height="16" rx="2" fill="#fff" stroke="#8a4fc7" stroke-width="1.6"/><text x="865" y="407" text-anchor="middle" class="s b">A</text>
<rect x="873" y="420" width="14" height="16" rx="2" fill="#fff" stroke="#2a9d4a" stroke-width="1.6"/><text x="880" y="432" text-anchor="middle" class="s b">B</text>

<!-- motor 2 -->
<rect x="900" y="465" width="140" height="140" rx="6" class="box"/>
<text x="910" y="488" class="s">blue  (A+)</text>
<text x="910" y="513" class="s">red  (A-)</text>
<text x="910" y="568" class="s">green  (B+)</text>
<text x="910" y="593" class="s">black  (B-)</text>
<text x="970" y="530" text-anchor="middle" class="b">NEMA 17 #2</text>
<text x="970" y="544" text-anchor="middle" class="s">right end of rail,</text><text x="970" y="557" text-anchor="middle" class="s">mirrors 4-6</text>
<text x="900" y="622" class="s">0.5 m 4-pin lead,</text><text x="900" y="635" class="s">out the RIGHT end wall</text>

<!-- ESP32 -->
<rect x="40" y="200" width="220" height="300" rx="6" class="box"/>
<text x="52" y="226" class="b">XIAO ESP32-S3</text>
<text x="52" y="242" class="s">3.3 V logic</text>
<text x="52" y="258" class="s">5 V from the buck (diode),</text><text x="52" y="272" class="s">USB only for programming</text><text x="252" y="218" text-anchor="end" class="s">5V</text>
<text x="252" y="288" text-anchor="end" class="s">GND</text>
<text x="252" y="313" text-anchor="end" class="s">3V3</text>
<text x="252" y="338" text-anchor="end" class="s">D0 (GPIO1) STEP</text>
<text x="252" y="363" text-anchor="end" class="s">D1 (GPIO2) DIR</text>
<text x="252" y="388" text-anchor="end" class="s">D5 (GPIO6) EN</text>
<text x="52" y="450" class="s">One STEP / DIR pair drives</text><text x="52" y="464" class="s">both motors (NUM_MOTORS 1)</text>
<text x="351" y="441" text-anchor="middle" class="s">10k</text>
<rect x="336" y="444" width="30" height="12" fill="#fff" stroke="#e08a1e" stroke-width="2"/>
<text x="351" y="472" text-anchor="middle" class="s">pull-up</text>

<rect x="50" y="550" width="200" height="52" rx="6" class="box"/>
<text x="62" y="572" class="b">USB-C panel cable</text><text x="62" y="588" class="s">LEFT wall (programming)</text>

<rect x="300" y="500" width="300" height="104" rx="6" class="box"/>
<text x="310" y="520" class="b">Two motors in series</text>
<text x="310" y="538" class="s">Same current through both. Set the driver's current</text>
<text x="310" y="552" class="s">pot to about 1.5 A (motors are rated 1.68 A).</text>
<text x="310" y="570" class="s">Coil resistance doubles (about 3.3 ohm); fine at 24 V.</text>
<text x="310" y="584" class="s">Joints A and B are made in the box (see notes).</text>
<rect x="300" y="620" width="300" height="82" rx="6" class="box" stroke-dasharray="5 4"/>
<text x="310" y="640" class="b">Hall sensors: not fitted</text>
<text x="310" y="658" class="s">D10 (GPIO9) = half 1, D7 (GPIO44) = half 2,</text>
<text x="310" y="672" class="s">10k pull-up to 3V3 if open-collector, plus 3V3 + GND.</text>
<text x="310" y="686" class="s">Pins reserved; firmware hook only.</text>

<!-- notes -->
<rect x="30" y="720" width="1000" height="146" rx="6" fill="#fafbfc" stroke="#c8d0d8"/>
<text x="42" y="740" class="b">Notes</text>
<text x="42" y="758" class="s">24 V: supply, panel DC socket, two Wago 221-415 blocks (24 V and GND), then the driver's + and GND screw terminals with a 100 uF across them. Power wires 22 AWG, logic 26 AWG.</text>
<text x="42" y="774" class="s">Buck: 24 V to 5 V (check 5.0 V on a meter first), then a Schottky diode into the XIAO 5V pin. -IN and the buck ground share the GND Wago; never feed 5 V and USB without the diode.</text>
<text x="42" y="790" class="s">Series wiring: motor 1 blue to 1A, red to joint A (with motor 2 blue); motor 2 red to 1B. Motor 1 green to 2A, black to joint B (with motor 2 green); motor 2 black to 2B.</text>
<text x="42" y="806" class="s">Joints A and B are two small Wagos (or solder + heat shrink) in the box, so all four wires of each motor lead come back to the box. Never double wires into one driver terminal (that is parallel).</text>
<text x="42" y="822" class="s">Check each coil pair first (about 1.65 ohm, blue/red and green/black). If the motors turn opposite ways, swap a coil's two wires on motor 2. Never unplug a motor with 24 V on.</text>
<text x="42" y="838" class="s">EN has the 10k pull-up to 3V3 (essential with one supply). MS1/MS2 open = 1/8 step. Auto-start then runs the motors by itself. Six-mirror build: 3 units per motor.</text>
<text x="42" y="854" class="s">Nothing here has been built or tested; check every pin label on your boards. A broken lead stops both motors, and one driver fault stops both.</text>
</svg>
