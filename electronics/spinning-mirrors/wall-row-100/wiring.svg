<!-- ESP32 -->
<rect x="40" y="200" width="220" height="500" rx="6" class="box"/>
<text x="52" y="226" class="b">ESP32 dev board</text>
<text x="52" y="242" class="s">38-pin, 3.3 V logic</text>
<text x="52" y="270" class="s">powered from USB 5 V</text>
<text x="252" y="288" text-anchor="end" class="s">GND</text>
<text x="252" y="313" text-anchor="end" class="s">3V3</text>
<text x="252" y="338" text-anchor="end" class="s">GPIO25 STEP 1</text>
<text x="252" y="363" text-anchor="end" class="s">GPIO16 DIR 1</text>
<text x="252" y="388" text-anchor="end" class="s">GPIO19 EN (both)</text>
<text x="252" y="598" text-anchor="end" class="s">GPIO26 STEP 2</text>
<text x="252" y="623" text-anchor="end" class="s">GPIO17 DIR 2</text>
<text x="52" y="670" class="s">STEP 1 and 2 carry identical</text><text x="52" y="684" class="s">pulses (one register write)</text>
<text x="351" y="441" text-anchor="middle" class="s">10k</text>
<rect x="336" y="444" width="30" height="12" fill="#fff" stroke="#e08a1e" stroke-width="2"/>
<text x="351" y="472" text-anchor="middle" class="s">pull-up</text>

<rect x="50" y="730" width="200" height="52" rx="6" class="box"/>
<text x="62" y="752" class="b">USB-C panel cable</text><text x="62" y="768" class="s">RIGHT end wall, to laptop</text>
<rect x="300" y="730" width="300" height="82" rx="6" class="box" stroke-dasharray="5 4"/>
<text x="310" y="750" class="b">Hall sensors: not fitted</text>
<text x="310" y="768" class="s">GPIO35 = half 1, GPIO34 = half 2 (input only),</text>
<text x="310" y="782" class="s">each with its own 10k pull-up to 3V3, plus 3V3 + GND.</text>
<text x="310" y="796" class="s">Pins reserved; firmware hook only.</text>

<!-- notes -->
<rect x="30" y="830" width="960" height="122" rx="6" fill="#fafbfc" stroke="#c8d0d8"/>
<text x="42" y="850" class="b">Notes</text>
<text x="42" y="868" class="s">24 V: bench supply, DC jack, 5 A fuse, Wago, then each driver's + terminal with a 100 uF across + and GND. Power wires 22 AWG, logic 26 AWG.</text>
<text x="42" y="884" class="s">The ESP32 runs from USB only (no buck converter; never USB and a buck together). Everything shares one ground.</text>
<text x="42" y="900" class="s">Lock-step: STEP and DIR use separate pins, but the firmware writes both STEP pins in one register, so the edges are identical.</text>
<text x="42" y="916" class="s">DIR is separate so one motor can be inverted in firmware (DIR_INVERT). EN is shared: one pull-up keeps both drivers off at boot and they start and stop together.</text>
<text x="42" y="932" class="s">MS1/MS2 stay open on both drivers (1/8 step). Motor leads: plug on the motor end, other end stripped and ferruled into the driver's 1A/1B/2A/2B screws.</text>
<text x="42" y="948" class="s">Check each coil pair with a multimeter (about 1.65 ohm) before wiring. Never unplug a motor with 24 V on. Nothing here has been built or tested.</text>
</svg>

