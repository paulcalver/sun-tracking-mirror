<text x="210" y="95" class="b">DC jack + lead</text><text x="210" y="113" class="s">LEFT end wall</text><text x="210" y="127" class="s">22 AWG to the box</text>
<rect x="370" y="88" width="56" height="24" rx="4" fill="#fff" stroke="#d63031" stroke-width="2"/>
