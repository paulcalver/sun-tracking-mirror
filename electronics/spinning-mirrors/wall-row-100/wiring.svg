<text x="650" y="338" class="s">STEP</text>
<text x="650" y="363" class="s">DIR</text>
<text x="650" y="388" class="s">EN (low = on)</text>
<text x="650" y="404" class="s">MS1, MS2 open = 1/8 step</text>
<text x="650" y="422" class="b">Adafruit TMC2209 #1</text>
<text x="812" y="228" text-anchor="end" class="s">1A</text>
<text x="812" y="253" text-anchor="end" class="s">1B</text>
<text x="812" y="308" text-anchor="end" class="s">2A</text>
<text x="812" y="333" text-anchor="end" class="s">2B</text>
<rect x="860" y="205" width="140" height="140" rx="6" class="box"/>
<text x="870" y="228" class="s">coil A +</text>
<text x="870" y="253" class="s">coil A -</text>
<text x="870" y="308" class="s">coil B +</text>
<text x="870" y="333" class="s">coil B -</text>
<text x="930" y="279" text-anchor="middle" class="b">NEMA 17 #1</text>
<text x="930" y="295" text-anchor="middle" class="s">left end of rail,</text><text x="930" y="308" text-anchor="middle" class="s">mirrors 1-4</text>
<text x="930" y="310" text-anchor="middle" class="s" style="display:none"> </text>
<text x="860" y="362" class="s">0.5 m 4-pin lead,</text><text x="860" y="375" class="s">out the LEFT end wall</text>
<rect x="640" y="460" width="180" height="236" rx="6" class="box"/>
<text x="650" y="488" class="s">+ (motor supply)</text>
<text x="650" y="518" class="s">GND</text>
<text x="650" y="548" class="s">GND (logic)</text>
<text x="650" y="573" class="s">VDD (3.3 V logic)</text>
<text x="650" y="598" class="s">STEP</text>
<text x="650" y="623" class="s">DIR</text>
<text x="650" y="648" class="s">EN (low = on)</text>
<text x="650" y="664" class="s">MS1, MS2 open = 1/8 step</text>
<text x="650" y="682" class="b">Adafruit TMC2209 #2</text>
<text x="812" y="488" text-anchor="end" class="s">1A</text>
<text x="812" y="513" text-anchor="end" class="s">1B</text>
<text x="812" y="568" text-anchor="end" class="s">2A</text>
<text x="812" y="593" text-anchor="end" class="s">2B</text>
